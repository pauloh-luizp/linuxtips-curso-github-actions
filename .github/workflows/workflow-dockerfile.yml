name: Build & Push Container
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    env:
      GH_PACKEGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@V4

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push image
        env:
          REPO_ANTES: ${{ github.repository }}
        run: |
          REPO_DEPOIS=$(echo "$REPO_ANTES" | tr '[:upper:][:lower:]')
          IMAGE=ghcr.io/${REPOS_DEPOIS}/aplicacao:{{ github.sha }}
          docker build \
            --bild-arg GH_PACKAGES_TOKEN \
            -t "$IMAGE" \
            aplicacao
          docker push "$IMAGE"
